name: Feature request
description: Something elcapture should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, not the solution. "I need to see which Android app sent a request", not "add a column".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Another tool, a workaround, or not at all. If Charles, Proxyman, Reqable, Burp or another tool does it well, say how.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: Optional. How you'd like it to work.
